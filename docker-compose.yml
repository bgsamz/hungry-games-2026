services:
  hungry-games:
    build: .
    container_name: hungry-games
    ports:
      - "8080:8080"
    environment:
      # Host login. Copy .env.example to .env and set these there, so they aren't committed.
      ADMIN_USERNAME: ${ADMIN_USERNAME:-host}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-100}
      UPLOADS_PER_10_MIN: ${UPLOADS_PER_10_MIN:-40}
    volumes:
      - ./data:/data
    restart: unless-stopped
