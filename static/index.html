<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Hungry Games 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Stencil+Display:wght@700;800&family=Figtree:wght@400;600;700&display=swap" rel="stylesheet">
<style>
/* VOICE: deadpan-sincere recipe blog inside a survival-competition broadcast; the page plays it completely straight
   IDEA: the official contender dossiers of The Hungry Games. Every dish is a numbered contender
   PICTURE: home = Dad's empty place setting in the middle of the arena (with a visitor); dish = the contender photo, big
   COLOUR and TYPE: charcoal ground, ember orange, ash; stencil display + Figtree. Night palette in both themes
   LAYOUT: sticky top bar, hero band, contender grid by course; dish page = photo, backstory, skip-to-recipe, recipe, prev/next */
:root{color-scheme:dark;
--bg:#141213;--ink:#f1ece6;--mute:#b3a8a2;
--cran:#211b1b;--cran-ink:#f6efe9;--gold:#ff7a1a;--card:#1d1a1a;
--line:#3a3334;--soft:#262122}
*{box-sizing:border-box;min-width:0}
html{scroll-padding-top:72px}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.6 Figtree,system-ui,sans-serif;overflow-x:clip}
h1,h2,h3{font-family:"Big Shoulders Stencil Display",Impact,sans-serif;font-weight:800;line-height:1.02;text-wrap:balance;margin:0;letter-spacing:.01em}
h3{font-family:Figtree,sans-serif;font-weight:700;letter-spacing:0}
.hero,.dhead{background:radial-gradient(120% 90% at 70% 110%,rgba(255,122,26,.28),transparent 60%),var(--cran);border-bottom:2px solid var(--gold)}
.no{display:inline-block;font-family:"Big Shoulders Stencil Display",sans-serif;font-weight:800;color:var(--gold);font-size:20px;letter-spacing:.04em}
a{color:inherit}
button{font:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.top{position:sticky;top:0;z-index:5;background:#0d0b0b;border-bottom:1px solid var(--line);color:var(--cran-ink);display:flex;align-items:center;gap:12px;padding:10px max(5vw,16px);min-height:56px}
.top a{text-decoration:none;font-weight:700}
.top .home{font-family:"Big Shoulders Stencil Display",sans-serif;font-weight:800;font-size:24px;letter-spacing:.02em}
.top .sp{flex:1}
.top .menu{font-size:15px;border:1.5px solid rgba(255,255,255,.5);border-radius:99px;padding:8px 16px;min-height:44px;display:inline-flex;align-items:center}
.band{padding:clamp(28px,4vw,64px) max(5vw,16px)}
.wrap{max-width:1180px;margin:0 auto}
.hero{background:var(--cran);color:var(--cran-ink);padding-top:12px}
.hero .wrap{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:clamp(20px,4vw,56px);align-items:center}
.hero h1{font-size:clamp(48px,7.5vw,84px);text-transform:uppercase}
.hero .kick{font-weight:700;color:var(--gold);margin:0 0 10px}
.hero p{max-width:34em;opacity:.92;margin:16px 0 0}
.hero svg{width:100%;height:auto;display:block}
.course{margin-top:8px}
.course h2{font-size:32px;margin:36px 0 16px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:20px}
.tile{display:block;text-decoration:none;background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;transition:transform .2s}
.tile:hover{transform:translateY(-3px)}
.tile .ph{aspect-ratio:4/3}
.tile b{display:block;padding:4px 14px 2px;font-family:"Big Shoulders Stencil Display",sans-serif;font-weight:800;font-size:25px;line-height:1.1}
.tile .no{padding:12px 14px 0;font-size:16px}
.tile:hover{border-color:var(--gold)}
.tile span{display:block;padding:0 14px 14px;color:var(--mute);font-size:14px}
.ph{position:relative;background:var(--soft);display:grid;place-items:center;overflow:hidden}
.ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.ph .empty{text-align:center;color:var(--mute);font-size:14px;padding:16px;border:2px dashed var(--line);border-radius:10px;margin:14px;position:absolute;inset:0;display:grid;place-content:center;gap:6px}
.ph .empty svg{width:40px;height:40px;margin:0 auto;opacity:.7}
.dhead{background:var(--cran);color:var(--cran-ink);padding-bottom:0}
.dhead .wrap{max-width:860px}
.dhead small{display:block;font-weight:600;opacity:.9;margin-bottom:10px;font-size:15px}
.dhead h1{font-size:clamp(38px,6.5vw,58px);text-transform:uppercase}
.dhead .meta{margin:14px 0 0;opacity:.92;max-width:40em}
.hero-ph{max-width:860px;margin:28px auto 0;border-radius:16px 16px 0 0;aspect-ratio:3/2;box-shadow:0 -1px 0 rgba(0,0,0,.05)}
.dbody{max-width:860px;margin:0 auto;padding:0 max(5vw,16px) 64px}
.jump{display:flex;justify-content:center;margin:28px 0 8px}
.btn{background:var(--gold);color:#1a0f08;border:0;border-radius:99px;padding:12px 22px;min-height:44px;font-weight:700;text-decoration:none;display:inline-flex;align-items:center;gap:8px}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.story{max-width:38em;margin:0 auto}
.story h2,.recipe h2{font-size:32px;margin:40px 0 14px}
.story p{margin:0 0 1.1em}
.story p:first-of-type::first-letter{font-family:"Big Shoulders Stencil Display",sans-serif;font-weight:800;float:left;font-size:3.8em;line-height:.85;padding:6px 8px 0 0;color:var(--gold)}
.recipe{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:clamp(18px,4vw,36px);margin-top:36px;scroll-margin-top:76px}
.recipe h2{margin-top:0}
.recipe h3{font-size:22px;margin:24px 0 8px}
.cols{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr);gap:clamp(16px,4vw,40px)}
.ing{list-style:none;padding:0;margin:0}
.ing li{border-bottom:1px solid var(--line)}
.ing button{all:unset;cursor:pointer;display:flex;gap:10px;align-items:flex-start;padding:9px 0;min-height:28px;width:100%;box-sizing:border-box}
.ing button:focus-visible{outline:3px solid var(--gold)}
.ing i{flex:none;width:18px;height:18px;border:2px solid var(--line);border-radius:5px;margin-top:4px}
.ing .done{text-decoration:line-through;color:var(--mute)}
.ing .done i{background:var(--gold);border-color:var(--gold)}
.steps{padding:0;margin:0;list-style:none;counter-reset:s}
.steps li{counter-increment:s;position:relative;padding:0 0 14px 44px}
.steps li::before{content:counter(s);position:absolute;left:0;top:0;width:30px;height:30px;border-radius:50%;background:var(--gold);color:#1a0f08;display:grid;place-items:center;font-weight:700;font-size:15px}
.note{background:var(--soft);border-radius:10px;padding:12px 16px;margin:18px 0 0;font-size:15px}
.pn{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:36px}
.pn a{display:block;text-decoration:none;border:1px solid var(--line);border-radius:12px;padding:12px 16px;min-height:44px}
.pn a small{display:block;color:var(--mute);font-size:13px}
.pn a b{font-family:"Big Shoulders Stencil Display",sans-serif;font-weight:800;font-size:22px;line-height:1.15}
.pn a:hover{border-color:var(--gold)}
.pn .nx{text-align:right;grid-column:2}
.foot{text-align:center;color:var(--mute);font-size:14px;padding:24px 16px 40px}
.muted{color:var(--mute)}.small{font-size:14px}
.sec{font-size:clamp(32px,4.5vw,44px);text-transform:uppercase;margin:0 0 6px}
.tile .tr{display:block;padding:0 14px 14px;color:var(--gold);font-weight:700;font-size:14px;margin-top:-8px}
.rank{width:100%;max-width:900px;border-collapse:collapse;margin-top:18px;font-size:16px}
.rank th{text-align:left;font-size:13px;color:var(--mute);font-weight:600;padding:8px 10px;border-bottom:2px solid var(--line)}
.rank td{padding:10px;border-bottom:1px solid var(--line);vertical-align:middle}
.rank .r{text-align:right;white-space:nowrap}
.rank .n{width:2.5em;font-family:"Big Shoulders Stencil Display",sans-serif;font-weight:800;font-size:22px;color:var(--gold)}
.rank a{text-decoration:none;font-weight:600}.rank a:hover{color:var(--gold)}
.rank .bar{display:block;height:6px;border-radius:3px;background:var(--soft);margin-top:6px;overflow:hidden}
.rank .bar i{display:block;height:100%;background:var(--gold)}
.rank tr.top1 td{background:rgba(255,122,26,.08)}
.hsum{margin:14px 0 0}
.hsum button{all:unset;cursor:pointer;color:var(--gold);font-weight:700;border-bottom:1px dashed currentColor}
.verdict{text-align:center;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:clamp(18px,4vw,32px);margin-top:28px;scroll-margin-top:76px}
.verdict h2{font-size:34px;text-transform:uppercase;margin:0 0 6px}
.stars{display:flex;justify-content:center;gap:6px;margin:14px 0 6px}
.stars button{background:none;border:0;font-size:44px;line-height:1;width:56px;height:56px;color:var(--line);border-radius:10px;transition:transform .15s,color .15s}
.stars button.on{color:var(--gold)}
.stars button:hover{transform:scale(1.12)}
.photos{margin-top:28px}
.photos h2{font-size:34px;text-transform:uppercase;margin:0 0 6px}
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px;margin-top:16px}
.gi{all:unset;cursor:pointer;aspect-ratio:1;border-radius:10px;overflow:hidden;background:var(--soft);position:relative}
.gi img{width:100%;height:100%;object-fit:cover;display:block}
.gi:focus-visible{outline:3px solid var(--gold)}
.gi small{position:absolute;left:6px;bottom:6px;background:rgba(0,0,0,.65);color:#fff;font-size:12px;padding:2px 7px;border-radius:6px;max-width:calc(100% - 12px);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.up{display:flex;flex-wrap:wrap;align-items:center;gap:12px;margin-top:14px}
.up label{cursor:pointer}
.up input{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
.up label:focus-within{outline:3px solid var(--gold);outline-offset:2px}
.ov{position:fixed;inset:0;z-index:20;background:rgba(8,6,6,.92);display:grid;place-items:center;padding:16px}
.ov[hidden]{display:none}
.ov .box{max-width:min(1000px,100%);max-height:100%;display:grid;gap:12px;justify-items:center}
.ov img{max-width:100%;max-height:78vh;border-radius:10px;object-fit:contain}
.ov .row{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;align-items:center}
.ov .form{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px;width:min(420px,100%);display:grid;gap:12px}
.ov input[type=password]{font:inherit;font-size:16px;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);min-height:44px}
.btn.danger{background:#d4412f;color:#fff}
.linkbtn{all:unset;cursor:pointer;text-decoration:underline;color:var(--mute)}
@media(max-width:700px){.hero .wrap,.cols{grid-template-columns:1fr}.hero svg{max-width:360px;margin:0 auto}.top .home{font-size:18px}.hero-ph{border-radius:0}}
@media(prefers-reduced-motion:reduce){.tile{transition:none}html{scroll-behavior:auto}}
</style>
</head>
<body>
<header class="top"><a class="home" href="#">The Hungry Games</a><span class="sp"></span><a class="menu" href="#">All contenders</a></header>
<main id="app"></main>
<p class="foot">The Hungry Games, Thanksgiving 2026. The backstories are fiction. The recipes are real. Kevin is unconfirmed.<br><button type="button" class="linkbtn" data-host>Host tools</button></p>

<script>
{
const D=[
{id:"turkey",course:"Mains",name:"Turkey (cider brine)",short:"Cider-brined, herb butter",
meta:"Source: @cassyeungmoney on Instagram. Brine the day before, then roast at 350°F for about 15 min per lb.",
story:["I want to start by saying that this turkey has a name, and the name is Brenda, and I will not be taking questions.",
"Every year I brine Brenda in apple cider, because cider is what I was drinking the night the raccoon and I made eye contact through the sliding door in 2014 and silently agreed that only one of us would leave that patio with the rotisserie chicken. It was him. It’s always him. He still comes every Thanksgiving, he still sits in Dad’s chair, and he still won’t tell us where he was on the night of the 14th.",
"You’ll notice step six asks you to inject melted butter into the meat. I learned this from Dale. Yes, that Dale. After the Costco incident he got really into what he calls “home medicine,” and one Christmas he showed up with a bag of syringes and a frozen bird and said, “Nobody checks your credentials on a turkey.” He was right. It was the juiciest turkey I have ever eaten. Marguerite watched the whole thing from the doorway in a brand-new pair of clogs, saying nothing. I have a lot of questions about who bought her those clogs.",
"The Tony’s is for my father. Before he left to find the five spices, the only seasoning in our house was Tony’s, and he put it on everything: eggs, popcorn, my scraped knee once. I think he believed that if he could find five spices as good as Tony’s, he would finally be a complete man. He sent one postcard, from Lafayette, Louisiana. It just said “CLOSER.” That was 1998.",
"The oranges come from a tree in Gary’s backyard. I don’t live with Gary anymore, but the tree doesn’t know that, and neither does Gary’s new wife, as long as I go after 2 a.m.",
"Roast it to 165°F, and please, use a thermometer. My sister didn’t, in 2021, and three of us spent the night at St. Agatha’s, where a man in scrubs told us it was “probably the spleen.” It was not the spleen. Kevin drove us home. Nobody called him. To this day I don’t know how he knew.",
"Finally, let it rest for 30 minutes. Brenda has been through a lot. We all have. Recipe below."],
ing:[["Brine",["4 cups apple cider","~12 cups water","2 large oranges","3 sprigs rosemary","2 Tbsp peppercorns","4 bay leaves","1 1/2 cups brown sugar","1 1/2 cups coarse salt"]],
["Turkey and herb butter",["13 lb turkey","1 1/2 sticks unsalted butter, softened","2 sprigs rosemary, 3 sprigs thyme","2 garlic cloves, grated","1 Tbsp Tony’s or other Creole seasoning","2 tsp onion powder, 2 tsp garlic powder","1 tsp salt, 1 tsp pepper"]],
["Roasting pan",["2 onions, 4 carrots, 4 celery stalks, 1 head of garlic","Extra rosemary and thyme","1 cup white wine, 2 cups chicken broth"]]],
steps:[["Steps",["Day before: boil the brine, cool it completely, add the turkey and refrigerate overnight.","Morning of: discard the brine, rinse the bird well, pat dry and leave at room temp for at least 1 hour.","Heat the oven to 350°F. Mix the herb butter. Season the vegetables with salt and pepper and spread them in the roasting pan.","Loosen the skin, push butter underneath and rub it over the outside. Keep about 1/4 cup back.","Set the turkey on the vegetables and stuff the cavity with some vegetables and herbs. Tuck the wings and tie the legs.","Melt the reserved butter and inject it into the meat.","Put a thermometer in the thickest part of the thigh, not touching bone. Roast to 165°F. A 12.5 lb bird took about 3 hours.","Rest at least 30 minutes."]]],
note:"The original recipe doesn’t say when the wine and broth go in. They probably go in the pan with the vegetables."},

{id:"ham",course:"Mains",name:"The Ultimate Honeybaked Ham",short:"Three broils, one sugar crust",
meta:"Source: Elizabeth Wu. Serves 10. Takes about 2 1/2 hours: 20 min prep, then about 8 min per lb at 275°F plus three short broils.",
story:["This ham is spiral-sliced, which is fitting, because so was my Aunt Deb after September 11th.",
"The next morning, while the rest of the country lined up to give blood, Aunt Deb drove to the Sam’s Club in Fresno and bought forty-one hams. When the cashier asked if she was having an event, she looked him dead in the eye and said, “They can take a lot from us, Travis. They cannot take the ham.” His name was not Travis. It was Kevin. It’s always Kevin. We ate ham at every meal until Easter 2003, and to this day none of us can hear the national anthem without smelling cloves.",
"That spring, a letter finally came from Dad, the first since the Lafayette postcard. He’d taken a job driving supply trucks in Iraq because, quote, “the spices are over here, I can feel it.” Inside was a little baggie of sumac and a note that just said “FOUR.” Mom cried. The raccoon cried. I put the sumac on the ham. It’s not in this recipe because it was frankly a terrible idea, but I want you to know it’s here in spirit.",
"The three broils are for the three times Dale has tried to perform a “minor procedure” on this ham. He says the spiral cut is “an incision that never healed.” He’s not allowed near the broiler anymore. Marguerite is, but only because she brings the hot honey. Nobody asks where she gets it, because the last person who asked was Gary.",
"Bake it low and slow, 275°F at 8 minutes a pound. That’s the same way I’ve learned to approach my sister: covered, from a distance, with fruit juice as a peace offering.",
"Let it rest 10 minutes. Then let yourself rest. Recipe below."],
ing:[["Ham and baste",["1 spiral-sliced ham","1 cup pineapple juice","4 Tbsp butter, melted","4 Tbsp hot honey"]],
["Sugar crust",["1 1/2 cups granulated sugar","3 cups dark brown sugar","1 1/2 tsp Lawry’s seasoned salt","1 1/2 tsp garlic powder","1 Tbsp cinnamon","1 1/2 tsp nutmeg","1 1/2 tsp ground cloves","1 1/2 tsp ground ginger","1 1/2 tsp sweet paprika","1 tsp allspice"]],
["Glaze",["1 cup ham drippings (from the pan)","2 Tbsp Dijon mustard","1 Tbsp apple cider vinegar","1 Tbsp soy sauce","The last third of the sugar crust mix"]]],
steps:[["Steps",["Set the ham flat side down on a roasting rack. Mix the melted butter and hot honey and brush it all over the ham, between the slices too. Pour the pineapple juice into the pan.","Cover with foil and bake at 275°F for 8 min per lb. An 11 lb ham takes about 1 1/2 hours.","Mix the sugars and all the spices, then split the mix evenly into 3 bowls.","Pat one bowl over the ham, working it into the crevices. Broil uncovered on high for 2 min.","Pat on the second bowl and broil 2 min more.","Take the ham out and save 1 cup of the pan drippings.","Glaze: in a saucepan, combine the drippings, Dijon, vinegar, soy sauce and the last bowl of sugar mix. Bring to a boil, then take it off the heat.","Pour the glaze over the ham and broil a final 2 min until bubbly and crisp.","Rest 10 min before serving."]]]},

{id:"stuffing",course:"Sides",name:"Sausage and Leek Stuffing",short:"Day-old bread, sweet Italian sausage",
meta:"Source: Claire Saffitz, NYT Cooking. Serves 10.",
story:["Stuffing is the only dish on the table that is allowed to live inside something else, and I think that’s beautiful, and I think that’s why I relate to it.",
"The bread has to be day-old. My grandmother always said fresh bread is for people with nothing to hide. She said it at my christening, at my graduation and at her own deposition. I’ve never asked what the deposition was about. The last time someone asked, Grandma just said “Reno” and left the room, and she didn’t come back until Easter.",
"The sausage is sweet Italian, because the one year I bought hot Italian, Kevin appeared out of nowhere in the meat aisle, took it out of my cart and said, “Not this year.” I didn’t argue. Kevin has been right about everything since the fleece vest.",
"You’ll want to burn a little sage while you cook. It isn’t for the recipe. It’s for the house. In 2017 Dale stayed in our guest room for two weeks, “recovering from a procedure I performed on myself,” and the energy has never been right since. Marguerite says the sage helps. Marguerite also says she’s “technically still licensed in Guam,” so do what you want with that.",
"Rinse the leeks very, very well, because leeks hide dirt between their layers, just like my sister. For eleven years she told everyone at Thanksgiving that she was “in finance.” She was in a Cheesecake Factory. She didn’t work at one. She was in one, most nights, in the big booth by the bathrooms. The manager knew her by name. He came to Thanksgiving once. It was nice.",
"Once it’s packed in the dish, it keeps in the fridge for up to two days. That’s also how long Dad’s sumac lasted before the raccoon got into it. He didn’t eat it. He just took it. I think he’s looking for the fifth spice too.",
"Bake it covered first, then uncovered until the top gets crisp, because everyone has to stop hiding eventually. Recipe below."],
ing:[["Ingredients",["1 lb loaf day-old white Pullman bread, crusts off, cut into 1/2-inch cubes (12 cups)","8 Tbsp unsalted butter","1 lb sweet Italian sausage, casings removed","4 celery ribs, chopped","2 medium leeks, white and light green parts, chopped and rinsed","1 medium yellow onion, chopped","1/4 cup finely chopped fresh sage","Salt and pepper","1/2 cup heavy cream","2 large eggs, beaten","3 cups chicken or turkey stock"]]],
steps:[["Steps",["Bake the bread cubes at 350°F for 25–30 min, tossing every 10 min, until dry and golden. Put them in a large bowl.","Melt 6 Tbsp butter in a large skillet over medium-high. Brown the sausage, breaking it up, 6–8 min. Spoon the sausage into the bread bowl and leave the fat in the pan.","Over medium heat, cook the celery, leeks, onion and sage with salt and pepper until soft and browned at the edges, 12–15 min. Add to the bowl.","Whisk the cream and eggs, then whisk in 2 cups of stock. Pour over the bread and mix. Drizzle in more stock until the bread is moist but no liquid pools. You may not need all of it.","Grease a 3-qt dish with 1 Tbsp butter. Pack in the stuffing, dot the top with the last 1 Tbsp butter and cover with foil. It keeps in the fridge for up to 2 days.","Bake covered for 30 min at 350°F. Uncover, raise the oven to 400°F and bake 35–45 min more, until crisp."]]]},

{id:"mac-and-cheese",course:"Sides",name:"Tini’s Mac and Cheese",short:"Three cheeses, layered",
meta:"Source: Sugar and Soul. Serves 12.",
story:["I need you to shred the cheese yourself. I know. I know. But the bagged stuff is coated in wood pulp, and I will not serve wood pulp at Thanksgiving again. Not after Gary’s mother ate an entire bag of pre-shredded cheddar in our garage in 2016 and then tried to sell me a timeshare in the Poconos. I almost bought it. That’s how good she is.",
"You’ll notice the spice mix has exactly four spices. When I set the little bowl down at Dad’s empty place, the raccoon looked at it, looked at me, and slowly pushed the paprika onto the floor. I don’t know what he’s trying to tell me. Marguerite says he’s grieving. Dale says the raccoon has “a mild case of rabies, totally manageable” and offered to treat him with a melon baller. We said no. We’ve learned.",
"The pasta is cavatappi, which is Italian for “corkscrew,” which is the shape Grandma’s Buick made on the highway out of Reno. She was laughing the whole time. She had a duffel bag in the back seat that she said was “for the church.” It was not for the church. Kevin was hitchhiking on the shoulder that night, and we picked him up. He was wearing the fleece vest. He was always wearing the fleece vest.",
"Evaporated milk is what makes it creamy. “Evaporated” is also the only word my sister has ever used to describe 2009 through 2012. It’s the closest she’s come to an explanation, and honestly, it’s all I need.",
"Layer it: half the pasta, some cheese, the rest of the pasta, the rest of the cheese. Like a family, it’s mostly cheese and it only holds together under heat.",
"The recipe says you can cut the mozzarella down to half a pound. You can. I can’t. I’ve already lost too much. Recipe below."],
ing:[["Ingredients",["1 lb mozzarella, from a block (can be cut to 1/2 lb)","1 lb Colby Jack","8 oz sharp cheddar, yellow preferred","1 lb cavatappi","1 tsp garlic powder, 1 tsp smoked paprika, 1 tsp coarse salt, 1/2 tsp black pepper","3 Tbsp salted butter","3 Tbsp all-purpose flour","1 can (12 oz) evaporated milk","2 cups heavy cream","1 Tbsp Dijon (or 1 tsp mustard powder)","Fresh parsley, for garnish"]]],
steps:[["Steps",["Heat the oven to 350°F. Shred all the cheese, toss it together and split it into two bowls.","Cook the pasta al dente and drain. Mix the four spices in a small bowl.","Melt the butter in a large skillet and stir in half the spice mix. Whisk in the flour and cook 1–2 min until bubbling.","Whisk in the evaporated milk. When it thickens, add the cream, the rest of the spices and the Dijon, and whisk until thick.","Stir in one bowl of cheese a handful at a time until melted. Fold in the pasta.","Spread half in a 9x13 pan and top with a third of the remaining cheese. Add the rest of the pasta, then the rest of the cheese.","Bake 25–30 min, then broil 1–2 min until golden. Top with parsley."]]]},

{id:"potato-casserole",course:"Sides",name:"Emeril’s Twice Baked Potato Casserole",short:"Bacon, two cheddars, baked twice",
meta:"Source: Emeril Lagasse. Makes one 9x13.",
story:["Everything in my life happens twice. I married Gary twice, in the same Applebee’s. Grandma says I was born twice, because the first time “didn’t take.” And this casserole gets baked twice, because I don’t trust anything that’s only been through the fire once.",
"Start by pricking the potatoes with a fork. Only a fork. Dale will offer you a scalpel. Dale will tell you, “It’s sterile, I boiled it in the Crock-Pot.” Do not take the scalpel. In 2019 ten potatoes went into that Crock-Pot with it, and only nine came out. None of us has asked Dale where the tenth one went, and Dale has never offered.",
"You fold little cubes of white cheddar into the mash, so every few bites you hit a hidden pocket of cheese. My sister calls these “surprises.” My sister also called it a “surprise” when she showed up to Thanksgiving 2018 with a husband none of us had met, named Kevin. It was a different Kevin. We checked. We made him take off the vest. There was a second vest underneath.",
"Three-quarters of a pound of bacon seems like a lot, and it is. Marguerite cooks it on the hot plate from St. Agatha’s, which she never gave back and now calls “my inheritance.” She says the bacon is for everyone. Two-thirds of it goes into her purse.",
"The raccoon gets the potato skins. Nobody decided this. He just started taking them in 2015, and we were too tired to fight him on it. He lines them up on the fence, six on the left and four on the right. Dad used to do the same thing with his socks. I think about that a lot.",
"Bake it until it’s bubbling and golden, then let it sit a few minutes before you serve it. Everything deserves a minute. Recipe below."],
ing:[["Ingredients",["10 large russet potatoes (about 7 lb)","9 Tbsp unsalted butter, room temp (1 stick + 1 Tbsp)","1 cup sour cream","1/2 cup heavy cream","2 tsp salt, 1 1/2 tsp black pepper","3/4 lb bacon, cooked and crumbled","1/2 lb sharp white cheddar, cut into 1/2-inch cubes","3/4 lb mild cheddar, grated (3 cups)","1/2 cup finely chopped green onions","3 eggs, lightly beaten"]]],
steps:[["Steps",["Prick the potatoes and bake at 400°F for 1 to 1 1/4 hours, until tender. Let them cool enough to handle.","Halve them and scoop out the flesh. Mash with the 1 stick of butter, sour cream, cream, salt and pepper until chunky-smooth.","Mix in the bacon, white cheddar cubes, half the grated cheddar, the green onions and the eggs.","Butter a 9x13 with the last 1 Tbsp and lower the oven to 375°F. Spread in the potatoes and top with the rest of the cheddar.","Bake 35–40 min, until bubbling and golden."]]]},

{id:"scalloped-potatoes",course:"Sides",name:"French Onion Scalloped Potatoes",short:"New this year. Be nice to it.",
meta:"New for 2026. Serves 8 and takes about 2 hours, with a 9x9 dish.",
story:["This recipe is new this year, which makes it the youngest member of the family, and I need everyone to be nice to it. Nobody was nice to me when I was new. At my own baby shower, Grandma introduced me as “the replacement.”",
"The onions take forty minutes. Forty. You’ll stand there stirring and crying, and that’s okay, because the onions are a safe place. The onions don’t ask why you were at a Cheesecake Factory at 1 a.m. looking for your sister. The onions don’t know about the duffel bag.",
"It’s French onion because of Marguerite, who told us for years that she was from Lyon. In 2021 we found her high school yearbook at an estate sale in Bakersfield. She’d been voted Most Likely to Be Asked to Leave. She has never once said “oui.” But she makes a beautiful white sauce, and you can’t fake that, and I’ve decided it’s enough.",
"I can’t pronounce Worcestershire, and neither could Dad, which is why it never made his list of five spices. “It doesn’t count if you can’t say it,” he said. Gary pointed out that it’s a sauce, not a spice. Dad didn’t speak to him for the rest of dinner. That was easy, because Dad left before dessert, and then for good.",
"Slice the potatoes an eighth of an inch thick on a mandoline. Do not let Dale use the mandoline. Dale calls it “the guillotine,” and he gets a look in his eye. We’ve had to call Kevin about the mandoline more than once. He always comes. He’s never asked for gas money.",
"Let it cool for at least twenty minutes before you slice it. I know. Waiting is hard. Ask the raccoon. He’s been sitting at Dad’s place since 1994 (we think it’s the same raccoon), and he has never once touched the fork. Recipe below."],
ing:[["Caramelized onions",["3 lb yellow onions","4 Tbsp olive oil","1 1/2 tsp salt, divided","2 Tbsp water, plus more for deglazing","1 cup beef broth","4 garlic cloves, minced","1 Tbsp Worcestershire","1/2 tsp fresh rosemary, finely chopped","1/2 tsp thyme, finely chopped"]],
["Pancetta",["12 oz diced pancetta","1/2 tsp pepper"]],
["White sauce",["1 stick butter","1/2 cup flour","4 cups whole milk","1 tsp salt, 1/2 tsp pepper, 1/2 tsp rosemary"]],
["Assembly",["2 lb Yukon Gold potatoes","8 oz Gruyère, shredded, plus extra for the top if you like"]]],
steps:[["Steps",["Onions: slice the onions with the grain. Cook them in a large pot with the olive oil and 1 tsp salt over medium heat, stirring every few minutes, until deep brown, about 40 min.","To go faster, turn the heat to medium-high and let them catch slightly on the bottom. Deglaze with 2 Tbsp water and scrape up the fond. Repeat 2–3 times over about 20 min.","Add the beef broth, garlic, Worcestershire, rosemary, thyme and the last 1/2 tsp salt. Simmer 2–3 min until most of the liquid is gone, then move to a bowl.","Pancetta: in the same pot, fry the pancetta over medium heat for 3–5 min until crispy. Strain it and set aside both the pancetta and the fat.","White sauce: melt the butter in the same pot, scraping up the fond. Whisk in the flour and cook 1–2 min. Slowly whisk in the milk until thick, then season with the salt, pepper and rosemary.","Assembly: heat the oven to 350°F. Slice the potatoes about 1/8 inch thick.","In a 9x9 dish, start with a layer of white sauce. Add a third of the potatoes, a third of the onions, a few spoonfuls of pancetta and a quarter of the Gruyère. Repeat until the dish is nearly full. Finish with neatly laid potatoes, a little more sauce and a few dollops of onions.","Bake covered with foil for 30 min, then uncovered for 30 min more.","If you like, top with extra Gruyère and broil 1–3 min until golden and bubbly.","Let it cool at least 20 min before slicing."]]]},

{id:"sweet-potato",course:"Sides",name:"Marshmallow-Pecan Sweet Potato Casserole",short:"Sweet on top, something darker below",
meta:"Source: NYT Cooking. Serves 8–10.",
story:["Before we begin, I need to address the marshmallows. Yes, there are marshmallows. Yes, it’s savory underneath. This dish is two things at once, sweet on top and something darker below. If that bothers you, you can take it up with my therapist, who is Dale.",
"Cut all twenty marshmallows in half lengthwise. It takes a while. Gary’s mother does it every year, quietly, at the end of the counter, and she always ends up with thirty-nine halves. We’ve counted. We’ve searched her. In 2022 Kevin did a full pat-down and came up with nothing but a business card for the timeshare.",
"The cream gets steeped with bay leaves. Dad counted bay leaf as spice number two. Then in 2004 he sent a letter that just said “BAY LEAF REVOKED,” and we never found out why. Mom framed it. It hangs in the hallway, next to the photo of the raccoon in a tiny party hat on his “anniversary.”",
"Keep the marshmallows separate until Thursday. That isn’t for the recipe. It’s because of my sister, who once ate an entire bag of marshmallows on Wednesday night and told us they “evaporated.” That’s two things of hers that have evaporated now. I’m starting to think she’s the common factor.",
"Broil it for one to two minutes, and watch it closely. Watch it closely. I’m serious. In 2013 I looked away to answer the door, and when I looked back the marshmallows were on fire. Marguerite was standing over them with a fire extinguisher she definitely did not walk in with, saying, “Go ahead. Say something.” I didn’t. I still haven’t. Recipe below."],
ing:[["Ingredients",["4 large sweet potatoes (about 2 1/2 lb), scrubbed","1/2 cup heavy cream","3 bay leaves, preferably fresh","1 tsp black pepper, plus more to taste","3 Tbsp unsalted butter, room temp, plus more for the dish","1–2 Tbsp dark brown sugar","1 tsp coarse kosher salt, plus more to taste","2 large eggs, room temp","20 large marshmallows (about 5 oz), halved lengthwise","1/2 cup roasted salted pecans"]]],
steps:[["Steps",["Bake the pricked sweet potatoes on a lined sheet at 425°F until fork-tender, 1 to 1 1/2 hours.","Meanwhile, heat the cream, bay leaves and pepper until steaming, then take off the heat and let it steep.","Peel the potatoes into a large bowl. Strain the cream over them, discarding the bay. Add the butter, sugar and salt and whisk smooth. It should taste savory. Let it cool slightly.","Lower the oven to 350°F. Whisk in the eggs until fluffy and spread in a buttered 2-qt shallow dish. Lay the marshmallow halves cut-side down with small gaps, and scatter the pecans on top. It keeps in the fridge for up to 2 days; if you make it ahead, keep the marshmallows separate until Thursday.","Bake 20–25 min until hot through.","Broil 1–2 min until the marshmallows are deeply browned. Watch it closely."]]]},

{id:"green-beans",course:"Sides",name:"Homestyle Green Bean Casserole",short:"From scratch. No canned soup.",
meta:"Serves 6–8. 15 min prep and 30 min cook, in a 9x13 dish. It uses a from-scratch mushroom sauce instead of canned soup. This year we’re doubling it (two 9x13 dishes); the amounts below are for one batch.",
story:["We make this from scratch now. No canned soup. Canned soup has been banned from this house since 2010. That’s when Aunt Deb finally worked through the stockpile she started in September 2001 (not the hams, the other stockpile, the one in the crawlspace), and we all had to admit that soup does, in fact, expire.",
"We’re doubling it this year, two whole 9x13 dishes, because the second one is for Kevin. It’s not for Kevin to eat. Kevin doesn’t eat. Nobody has ever seen Kevin eat. He just holds the dish on his lap in the passenger seat and leaves. The dish comes back the next year, washed, with a note that says “Thank you.” Sometimes the note is in Dad’s handwriting. We don’t talk about that.",
"Blanch the green beans: boil them for a few minutes, then shock them in ice water. Grandma does this to all of us every Christmas. She calls it “the Reno method.”",
"The mushrooms are cremini, which are just baby portobellos. It’s the same mushroom at two different ages, like me and Gary’s new wife.",
"Thyme is spice number three. Dad was sure about thyme. He wrote it on his forearm in Sharpie the night he left, with a little star next to it. The raccoon has a star in the same spot on his fur. We had a vet look at it. The vet was Dale. Dale says it’s “a birthmark, probably.”",
"Save the last cup of fried onions for the top, and watch them, because they go from golden to burned in seconds. Like my sister’s first marriage. Like my second first marriage. Recipe below."],
ing:[["Ingredients",["1 1/2 lb fresh green beans, trimmed and blanched","10 oz cremini mushrooms, sliced","1 large shallot, minced","2 garlic cloves, minced","3 Tbsp butter","1/4 cup all-purpose flour","2 cups whole milk or vegetable broth","1 tsp salt, 1/2 tsp black pepper","1/2 tsp dried thyme","1 1/2 cups crispy fried onions, divided","1 sprig fresh thyme, for garnish (optional)"]]],
steps:[["Steps",["Heat the oven to 375°F and grease a 9x13 dish.","Melt the butter in a large pan over medium heat. Cook the shallot and mushrooms until tender, about 7 min. Add the garlic and cook 1 min.","Stir in the flour and cook 1–2 min. Slowly whisk in the milk until smooth and simmer until thick. Season with the salt, pepper and dried thyme.","Fold in the green beans and 1/2 cup of the fried onions, then pour into the dish.","Bake 20 min, until bubbling.","Scatter the remaining 1 cup of onions on top and bake 5–7 min more, until the onions are deep golden.","Garnish with fresh thyme and serve warm."]]]},

{id:"corn-pudding",course:"Sides",name:"Savory Corn Pudding",short:"Bacon, jalapeños and pepper jack",
meta:"Savory corn pudding with bacon, jalapeños and pepper jack. Serves 8. 20 min prep, including the bacon, then about 70 min baking and 10–15 min resting, in a 9x13 dish.",
story:["Corn pudding isn’t a pudding, and it isn’t cornbread. It’s something in between, and it refuses to be categorized. Grandma says that makes it “the most honest thing on the table.” She said this while wearing a name tag that read “HELLO MY NAME IS LORRAINE.” Grandma’s name is not Lorraine.",
"You need two cans of corn, one whole kernel and one cream-style. They represent my parents. One of them stayed whole. Mom says Dad was always “the creamed one.” She won’t elaborate. She just taps the BAY LEAF REVOKED frame and walks away.",
"The hot honey is Marguerite’s again. This year it came in a jar with a hand-drawn label that just says “NOT FROM GUAM.” Nobody asked. That’s what worries us.",
"Seed the jalapeños. In 2020 Gary’s mother left the seeds in on purpose, then sat across from Gary’s new wife and watched her eat an entire slice without blinking. Neither of them blinked. It was the most frightening thing I’ve ever seen, and I’ve watched Dale perform a tracheotomy on a pumpkin.",
"Bake it until the edges are set and the center jiggles a little but doesn’t look wet. Give the dish a gentle shake to check. Do not shake Kevin to check. He’s fine. He’s always fine. He just stands very still in the doorway sometimes.",
"Let it rest 10 to 15 minutes, then drizzle on more hot honey. The raccoon will try to get the bacon off the top. Let him have a piece. It’s a holiday. Recipe below."],
ing:[["Base",["1 box (8.5 oz) Jiffy Corn Muffin Mix","1 stick (1/2 cup) unsalted butter, melted","2 large eggs, beaten","1 can (15 oz) whole kernel corn, drained","1 can (15 oz) cream-style sweet corn","1 cup full-fat sour cream (or full-fat Greek yogurt)","1–2 Tbsp hot honey, plus more for serving"]],
["Savory add-ins",["12 oz bacon, cooked crisp and crumbled, divided","2 jalapeños, seeded and finely diced, plus 1 more, thinly sliced, for the top (optional)","1 can (4 oz) mild diced green chiles, drained (or 1/4 cup chopped pickled jalapeños)","1 1/2 cups shredded pepper jack, divided","Fresh chives, chopped, for serving"]]],
steps:[["Steps",["Heat the oven to 350°F and grease a 9x13 dish.","Whisk the eggs, sour cream, melted butter and 1–2 Tbsp hot honey until smooth. Stir in both cans of corn.","Fold in most of the bacon (save some for the top), the diced jalapeños, the green chiles and 1 cup of the pepper jack. Gently fold in the Jiffy mix until just combined.","Spread in the dish. Top with the remaining 1/2 cup pepper jack and a few jalapeño slices if you like.","Bake about 70 min, checking from 60 min, until the edges are set and the top is lightly golden. The center should jiggle slightly but not look wet. Tent with foil if it browns too fast.","Rest 10–15 min. Finish with chives, a drizzle of hot honey and the reserved bacon."]]]},

{id:"cranberry-sauce",course:"Sides",name:"Five Spice Cranberry Sauce",short:"The origin story. Start here.",
meta:"A smooth, strained sauce. This year we’re making 1 1/2 batches; the amounts below are for one.",
story:["If you’ve made it this far, you probably have questions. Who is Dale? Why does Marguerite have a hot plate? Why is there a raccoon in Dad’s chair, and who, exactly, is Kevin? I’ve been putting this off. But it’s time. It all started with this cranberry sauce.",
"The first time I made this cranberry sauce, I was in the waiting room at St. Agatha’s while my mother had her spleen removed. Not the whole spleen, just the part that “knew too much,” according to the surgeon. I later found out he wasn’t technically a surgeon. He was a man named Dale who had been wearing scrubs at a Costco.",
"There was no stove in the waiting room, which is where the cognac comes in. You’ll notice this recipe calls for 1/4 cup. It originally called for the whole bottle, but most of that went to Marguerite, the night nurse, in exchange for her not reporting the hot plate. Marguerite, if you’re reading this: I still have your clogs. You know what you did.",
"Cranberries have always reminded me of my father, who left when I was six to “go find the five spices.” He’d heard there were five. He had only ever found three. Every Thanksgiving we set a place for him, and every Thanksgiving a raccoon sat there instead. Honestly, the raccoon was a better listener. When I finally found Chinese five spice at a Trader Joe’s in 2019, I knew in my bones it wasn’t the five he meant, and I wept so hard that a man in a fleece vest asked if I was okay. I said, “I have never been okay, Kevin.” His name turned out to be Kevin. We don’t talk about that.",
"As for the champagne, it’s from my second wedding, which was technically also my first wedding, to the same man, in the same Applebee’s, after a misunderstanding with the county clerk that I’m legally not allowed to describe. We never opened it. It felt wrong to drink it and wrong to throw it away, so now it lives here, in a sauce, where it can finally be useful. Like I never was to Gary.",
"Anyway, the secret is to strain it through a fine mesh sieve, the same way I strained my relationship with my sister. Now you know everything. Go back and read the others again. They will make even less sense. Recipe below."],
ing:[["Ingredients",["1 lb (450 g) fresh or frozen cranberries","1 1/2 cups (300 g) granulated sugar","1 cup (240 ml) orange juice","1 cup (240 ml) champagne","1/4 cup (60 ml) cognac","2 tsp (8 g) green cardamom, finely ground","1 tsp (4 g) Chinese five spice"]]],
steps:[["Steps",["Heat a medium saucepan over medium. Add the cognac and reduce it by half, stirring in the cardamom and five spice.","Add the cranberries, sugar, champagne and OJ. Boil for 12–15 min.","Blend on high until smooth, then pass through a fine strainer. Press plastic wrap onto the surface and chill."]]]},

{id:"rolls",course:"Sides",name:"Salted Butterflake Rolls",short:"Five eggs. Only four go in.",
meta:"Source: Sohla El-Waylly, NYT Cooking. Makes 12; we’re doubling it this year (24 rolls). The amounts below are for one batch, so double everything, including the dough. The dough is Claire Saffitz’s All-Purpose Enriched Bread (below), which needs at least 4 hours chilling, so start the day before.",
story:["This recipe calls for five eggs, and only four go into the dough. I’ve made these rolls for six years, and I still don’t know what the fifth egg is for. So now I set it at Dad’s place. The raccoon guards it. Every Friday morning the egg is gone, and a single bay leaf is sitting where it was. That’s all I’m going to say about it.",
"Start the day before, because the dough has to chill for at least four hours and up to twenty-four. Twenty-four hours is also how long Grandma once spent in the walk-in freezer at the Olive Garden in Reno. She said she was “waiting for someone.” She came out with frost in her hair and the name tag. That’s when the Lorraine thing started.",
"The first step is a tangzhong: you cook milk and flour together until it’s as thick as mashed potatoes. I learned the word from Kevin. Kevin speaks eleven languages. He’s never told us which ones. When he says “tangzhong” it sounds like a threat, but a kind one.",
"Then comes the windowpane test: stretch a little piece of dough until it’s thin enough to see light through. If it tears, keep mixing. My sister does the windowpane test on every man she dates. She holds them up to the window. Some of them don’t come back. The second Kevin passed.",
"Roll out the dough, brush it with butter, cut it into strips and stack them, so every roll is a little tower of layers. Like a family. Dale says “like a spleen,” but Dale has been wrong about spleens before.",
"We’re doubling them this year, so that’s 24 rolls. Brush them with butter again the second they come out of the oven. They deserve it. They’ve been through so much. Recipe below."],
ing:[["Rolls",["6 Tbsp (84 g) salted butter, melted and cooled, plus more to serve","1 recipe All-Purpose Enriched Bread dough (below)","All-purpose flour, for rolling","1 large egg","Flaky salt"]],
["All-Purpose Enriched Bread dough (Claire Saffitz, NYT Cooking)",["1 cup (240 g) whole milk or buttermilk","6 Tbsp (50 g) + 3 3/4 cups (490 g) all-purpose flour","5 large eggs, chilled (only 4 go in the dough)","2 Tbsp vegetable or olive oil","1/4 cup (50 g) granulated sugar","10 g kosher salt (2 3/4 tsp Diamond Crystal or 1 1/2 tsp Morton)","2 tsp (6 g) active dry yeast","1/2 cup (113 g) unsalted butter, in 1/2-inch pieces, chilled"]]],
steps:[["Dough (start the day before)",["Tangzhong: whisk the milk and 6 Tbsp flour in a saucepan over medium until it’s as thick as mashed potatoes, about 2 min. Scrape it into the stand mixer bowl and cool to room temp, about an hour.","Add 4 eggs, the oil, sugar, salt, yeast and remaining flour. Mix with the dough hook on low for 3 min, then medium-low for 12–15 min until smooth and elastic.","Add the butter in two halves, mixing each one in on low. Then mix on medium-low 10–15 min until very elastic and it passes the windowpane test.","Fold it into a smooth ball and put it back in the bowl. Cover, rest 30 min at room temp, then chill 4–24 hours."]],
["Rolls",["Brush a standard muffin tin with butter, both the cups and the top.","Split the chilled dough into 2 halves (about 550 g each). Roll one half into a 1/4-inch-thick square about 11 inches wide and brush it generously with butter.","Cut it into 6 strips lengthwise and stack them. Cut the stack crosswise into 6 portions. Set each in a muffin cup, cut side up. Repeat with the other half.","Splash with water, cover loosely and let rise until very puffy, 30–60 min.","Heat the oven to 350°F. Brush with egg beaten with 1 Tbsp water and sprinkle flaky salt. Bake 18–22 min, then brush with the rest of the butter while hot."]]],
note:"They keep airtight for 5 days or frozen for 1 month."},

{id:"pie-crust",course:"Desserts",name:"All-Purpose Flaky Pastry Dough",short:"One dough, two pies",
meta:"Source: Claire Saffitz, What’s for Dessert. One batch makes 2 crusts, one each for the pecan and pumpkin pies. 25 min active and about 2 1/2 hours total, plus chilling. You’ll need a bench scraper.",
story:["One batch of this dough makes two crusts, one for the pecan pie and one for the pumpkin. They start out as the same dough. Then they’re split apart and sent off to live completely different lives. Just like me and my sister. One of us became a pie. The other one lives at a Cheesecake Factory.",
"Smash the cold butter into the flour with your fingertips. Grandma taught me this. She has the coldest hands of anyone I’ve ever met, which she says is from “the freezer thing.” Dale says it’s “technically a symptom.” He won’t say of what. He just writes something on a Costco receipt and tucks it into his scrubs.",
"You’ll need a bench scraper. I got mine from Gary in the first divorce. He got it back in the second divorce. Then one day at a Target, Gary’s new wife handed it to me without a word and walked away. I think about her a lot. I think she’s going to be okay.",
"The first step of rolling it out is to beat the dough evenly with the rolling pin. Beat it. It’s the most therapeutic part of Thanksgiving. Marguerite does it for me now. I don’t ask who she’s picturing, and she doesn’t ask who I’m picturing. It’s the healthiest relationship either of us has.",
"If the dough cracks, press a scrap from the edge over the crack and keep rolling. That’s it. That’s the whole family motto. We had it stitched on a pillow. The raccoon sleeps on it.",
"It keeps for three months in the freezer. Grandma says she could beat that. Nobody wants to find out. Recipe below."],
ing:[["Ingredients",["3 cups (405 g) all-purpose flour, plus more for rolling","2 Tbsp sugar","2 tsp Diamond Crystal kosher salt (or 1 tsp Morton)","2 1/2 sticks (283 g) unsalted butter, thinly sliced crosswise, chilled","About 1 cup ice water (you’ll use about 2/3 cup)"]]],
steps:[["Steps",["Whisk the flour, sugar and salt in a large bowl.","Set aside about 1 cup of ice water. Toss the butter into the flour, then smash it into smaller pieces with your fingertips. Make a well, add 2/3 cup of the ice water and toss with a fork until clumpy with dry spots.","Tip it onto the counter. Chop and toss it with the bench scraper until the pieces are small and even, with butter no bigger than a pea.","Squeeze the pile together. Drizzle 1/2 Tbsp ice water over any dry floury bits, chop it in and squeeze again. Repeat until no dry flour is left.","Pat into a square and roll it 3/4 inch thick. Cut it in half, stack the halves, roll to flatten, then cut and stack again. Chill 10–15 min if the butter gets soft.","Roll into a 3/4-inch-thick rectangle and cut it in half crosswise. Shape each half into a disk.","Wrap each disk tightly, roll over the wrap to press the dough out to fill it, and chill at least 2 hours."]],
["Rolling it out",["Let the chilled dough sit 1–2 min, then unwrap it onto a lightly floured surface.","Beat it evenly with the rolling pin, rotating it, until it’s just under 1/2 inch thick.","Roll it out, dusting with flour and rotating often, to the size the pie needs. Chill it 10 min if it gets soft.","If it cracks, press a scrap from the edge over the crack and keep rolling."]]],
note:"The dough keeps 2 days in the fridge or 3 months in the freezer. Thaw frozen dough overnight in the fridge."},

{id:"pecan-pie",course:"Desserts",name:"Brown Butter Bourbon Pecan Pie",short:"High-proof. Not negotiable.",
meta:"It needs to chill overnight, so make it at least a day ahead. Uses one Flaky Pastry Dough crust.",
story:["This pie has bourbon in it. High-proof bourbon. That’s not negotiable. The first time I made it, I used regular bourbon, and Aunt Deb took one bite, set down her fork and said, “I didn’t survive the ham years for this.” She was right. She hadn’t.",
"Brown the butter, then pour it out of the pan right away, before it burns. Timing is everything. I learned that from Dad, who left exactly four minutes before dessert in 1994. That’s the precise moment a man can walk out without anyone noticing until the pie comes out. He had it down to a science. The raccoon showed up at four minutes and one second. We’ve timed it on the VHS.",
"The tin of golden syrup has a dead lion on it, with bees coming out of it. That’s real. Look it up. Grandma keeps one on her nightstand. When I asked her why, she said, “So I remember.” Remember what, Grandma? “Reno.”",
"It takes three eggs plus one extra yolk. The yolk is for Kevin. He doesn’t eat it. He just holds it in his hand until it’s time for him to go. He’s held one every year since 2019. Nobody knows where the yolks go after that.",
"Chill the pie overnight. I know you want to cut into it. Don’t. It needs time to set, like a bone, Dale says. Dale would know. He’s set four of mine, and three of them weren’t broken.",
"Serve it with vanilla bean ice cream and the knowledge that you did your best. Recipe below."],
ing:[["Filling",["6 Tbsp (85 g) unsalted butter","3/4 cup (135 g) dark brown sugar","3/4 cup (240 g) light corn syrup","1/3 cup (120 g) Lyle’s golden syrup","1 vanilla bean, seeds scraped","1/2 tsp (2 g) fine sea salt","3 large eggs + 1 large yolk","2 1/2 Tbsp (32 g) high-proof bourbon","2 1/2 cups (250 g) pecan halves","Vanilla bean ice cream, to serve"]]],
steps:[["Steps",["Heat the oven to 350°F. Brown the butter 3–4 min, then pour it into a bowl to stop it cooking.","Stir in the sugar, both syrups, the vanilla seeds and the salt. Whisk in the eggs, yolk and bourbon until smooth.","Spread the pecans in the crust and pour the filling over them. Bake 50–55 min until golden and set.","Cool to room temp, wrap and chill overnight. Serve with ice cream."]]]},

{id:"pumpkin-pie",course:"Desserts",name:"Caramelized Honey Pumpkin Pie",short:"The five spices, finally",
meta:"From the “Pies and Tarts” chapter of the same book as the crust. Serves 8. Uses one Flaky Pastry Dough crust, parbaked in a 9-inch pie plate.",
story:["I need you to count the spices in this pie. Go ahead. I’ll wait.",
"Cinnamon. Ginger. Allspice. Nutmeg. Cloves.",
"Five.",
"I found this recipe in 2023, in a cookbook at a garage sale in Lafayette, Louisiana. I had driven there for no reason I could explain. The page was dog-eared, and in the margin someone had written “IT WAS PIE THE WHOLE TIME” in Sharpie, with a little star next to it. I sat down on the curb and cried so hard that a man in a fleece vest asked if I was okay. I didn’t even have to look up.",
"There’s no bay leaf. There’s no sumac. There’s no Tony’s. Dad spent twenty-nine years looking in the wrong aisle. We still set a place for him, and the raccoon still sits in it. This year, for the first time, the raccoon ate the pie.",
"The honey has to be dark and strongly flavored, but not buckwheat or chestnut. Marguerite tried to bring buckwheat. I said no. She said “Fine” and set a jar on the counter with no label at all. That’s the one we use. It’s perfect. I’ve decided I’m never going to ask.",
"When the pie is done, turn off the oven, prop the door open and let it cool inside so it doesn’t crack. Don’t rush it. Some things only hold together if you let them come down slowly. Grandma. Aunt Deb. My sister. Me.",
"You’ll have leftover filling. Bake it in a ramekin and give it to Kevin. He won’t eat it. He’ll just hold it. But this year, for the first time, he said “thank you” out loud. He has Dad’s voice. We don’t talk about that.",
"Serve it with whipped cream and a little fresh nutmeg. Happy Thanksgiving. Recipe below."],
ing:[["Ingredients",["5 Tbsp (71 g) unsalted butter","1/2 cup (113 g) honey, dark and strongly flavored (not buckwheat or chestnut)","3/4 cup (170 g) heavy cream, room temp","4 large eggs (200 g), room temp","1/4 cup (50 g) packed dark brown sugar","1 can (15 oz / 425 g) unsweetened pumpkin puree, preferably Libby’s","2 tsp ground cinnamon, 1 1/2 tsp ground ginger","1 tsp vanilla extract","1 tsp (3 g) Diamond Crystal kosher salt","1/2 tsp allspice, 1/2 tsp nutmeg (plus more to serve), 1/4 tsp cloves","Softly whipped cream, to serve"]]],
steps:[["Steps",["Heat the oven to 325°F. Set the parbaked crust on a foil-lined rimmed sheet.","Brown the butter over medium-low, scraping constantly, until the solids are dark brown, 5–7 min.","Off the heat, stir in the honey. Return it to medium and boil, swirling, until slightly darker and nutty, about 2 min. Off the heat, slowly whisk in the cream until smooth.","Whisk the eggs, then the brown sugar, about 1 min until lighter. Whisk in the pumpkin, spices, vanilla and salt, then stream in the warm honey mixture.","Fill the crust to the top and bake leftover filling in a ramekin. Bake 45–60 min, until the edges are puffed and the center wobbles gently.","Turn off the oven, prop the door open and let the pie cool inside so it doesn’t crack.","Serve with whipped cream and fresh nutmeg. It keeps covered in the fridge for up to 3 days and is best on day 1 or 2."]]]},

{id:"sangria",course:"Drinks",name:"Sparkling Apple Cider Sangria",short:"The epilogue. Everyone’s here.",
meta:"Source: Lena Abraham, Delish. Serves 5 and takes 10 min. This year we’re doubling it (serves 10); the amounts below are for one batch.",
story:["This one takes ten minutes, which makes it the only thing at Thanksgiving that does.",
"Rim the glasses with cinnamon-sugar. Cinnamon was spice number one. Dad found it first, in 1994, at a Circle K. He always said, “You never forget your first.” None of us have.",
"The Fireball is for Dale. He calls it “anesthesia.” He isn’t wrong, which is the most upsetting thing about Dale.",
"We’re doubling it this year, enough for ten. Count us: me, Mom, my sister, the second Kevin, Grandma (or Lorraine), Aunt Deb, Marguerite, Dale, the raccoon, and Gary’s new wife, who we invited this year and who said yes. That’s ten. Kevin doesn’t need a glass. He’ll hold Dad’s.",
"Raise it. To the people who stayed, the people who left, and the people still standing very still in the doorway. Recipe below."],
ing:[["Ingredients",["1 lemon wedge","1/4 cup cinnamon-sugar","1 bottle (24 fl oz) sparkling cider, chilled","1 bottle white wine, chilled","1/3 cup Fireball","2 apples, thinly sliced (keep some for garnish)","Cinnamon sticks, to serve"]]],
steps:[["Steps",["Run the lemon wedge around each glass rim and dip it in cinnamon-sugar.","Mix the cider, wine and Fireball in a pitcher and stir in the apple slices.","Pour into the glasses and garnish with an apple slice and a cinnamon stick."]]]}
];

const photo=(d,cls,label)=>`<div class="ph ${cls}" data-dish="${d.id}"><div class="empty">${cam}<span>${label}</span></div></div>`;
const app=document.getElementById('app');

function home(){
  document.title="The Hungry Games 2026";
  app.innerHTML=`<section class="band hero"><div class="wrap"><div>
  <p class="kick">Thanksgiving 2026</p><h1>The Hungry Games</h1>
  <p>Fifteen contenders enter the dining room. Each one comes with its recipe and a deeply personal backstory nobody asked for. Pick a contender to read it, rate it and add your photos, or skip straight to the recipe like a normal person.</p>
  <p><a class="btn" href="#cranberry-sauce">Start with the origin story</a></p></div>${placeSVG}</div></section>
  <section class="band"><div class="wrap"><h2 class="sec">The standings</h2><p class="muted" style="margin:0">Live from everyone’s votes. It updates on its own.</p>
  <table class="rank"><thead><tr><th>#</th><th>Contender</th><th class="r">Rating</th><th class="r">Votes</th></tr></thead><tbody id="standings"></tbody></table></div></section>
  <section class="band" style="padding-top:0"><div class="wrap">${COURSES.map(c=>`<div class="course"><h2>${c}</h2><div class="grid">${D.filter(d=>d.course===c).map(d=>`<a class="tile" href="#${d.id}">${photo(d,'','Photo coming soon')}<span class="no">No. ${String(D.indexOf(d)+1).padStart(2,'0')}</span><b>${esc(d.name)}</b><span>${esc(d.short)}</span><span class="tr" data-rate="${d.id}"></span></a>`).join('')}</div></div>`).join('')}</div></section>
  <section class="band" style="padding-top:0"><div class="wrap photos"><h2>From the arena</h2><p class="muted" style="margin:0">Photos from the night: the table, the eating, the aftermath. Photos of a specific dish go on that dish’s page.</p>
  ${uploader('general')}<div id="gallery" data-tag="all"></div></div></section>`;
  scrollTo(0,0);
}

function dish(d){
  const i=D.indexOf(d),pv=D[i-1],nx=D[i+1];
  document.title=d.name+" · The Hungry Games";
  app.innerHTML=`<section class="band dhead"><div class="wrap"><small><span class="no">Contender No. ${String(i+1).padStart(2,'0')}</span> &nbsp;·&nbsp; ${d.course}</small><h1>${esc(d.name)}</h1><p class="hsum"><button type="button" data-goto="verdict" id="hsum">No votes yet</button></p></div>
  ${photo(d,'hero-ph','Photo of the '+esc(d.name.toLowerCase())+' coming soon')}</section>
  <div class="dbody">
  <div class="jump"><a class="btn" href="#${d.id}" data-jump>Skip the backstory, take me to the recipe ↓</a></div>
  <article class="story"><h2>The backstory</h2>${d.story.map(p=>`<p>${esc(p)}</p>`).join('')}</article>
  <section class="recipe" id="recipe-card"><h2>The recipe</h2><p class="meta" style="margin:0;color:var(--mute)">${esc(d.meta)}</p>
  <div class="cols"><div>${d.ing.map(([h,l])=>`<h3>${esc(h)}</h3><ul class="ing">${l.map(x=>`<li><button type="button" aria-pressed="false"><i></i><span>${esc(x)}</span></button></li>`).join('')}</ul>`).join('')}</div>
  <div>${d.steps.map(([h,l])=>`<h3>${esc(h)}</h3><ol class="steps">${l.map(x=>`<li>${esc(x)}</li>`).join('')}</ol>`).join('')}</div></div>
  ${d.note?`<p class="note">${esc(d.note)}</p>`:''}</section>
  <section class="verdict" id="verdict"><h2>Your verdict</h2><p class="muted" id="dish-rating" style="margin:0">No votes yet</p>
  <div class="stars" role="group" aria-label="Rate ${esc(d.name)}">${[1,2,3,4,5].map(n=>`<button type="button" data-star="${n}" aria-label="${n} star${n>1?'s':''}" aria-pressed="false">★</button>`).join('')}</div>
  <p class="muted small" id="mine-msg" style="margin:0">Tap a star. You can change your vote any time.</p></section>
  <section class="photos"><h2>Photos of this contender</h2>${uploader(d.id)}<div id="gallery" data-tag="${d.id}"></div></section>
  <nav class="pn">${pv?`<a href="#${pv.id}"><small>← Previous</small><b>${esc(pv.name)}</b></a>`:''}${nx?`<a class="nx" href="#${nx.id}"><small>Next →</small><b>${esc(nx.name)}</b></a>`:`<a class="nx" href="#"><small>Last one standing →</small><b>Back to all contenders</b></a>`}</nav>
  </div>`;
  scrollTo(0,0);
}

const byId=Object.fromEntries(D.map(d=>[d.id,d]));
const S={ratings:{},mine:{},photos:[],official:{},admin:'',loaded:false};
const store={get(k){try{return localStorage.getItem(k)||''}catch(e){return ''}},set(k,v){try{v?localStorage.setItem(k,v):localStorage.removeItem(k)}catch(e){}}};
const VOTER=(()=>{let v=store.get('hg-voter');if(!/^[A-Za-z0-9-]{8,64}$/.test(v)){v=(crypto.randomUUID?crypto.randomUUID():Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,12));store.set('hg-voter',v)}return v})();
S.admin=store.get('hg-admin');
const votes=n=>n+' vote'+(n===1?'':'s');
const summary=r=>r&&r.count?`${r.avg.toFixed(1)} ★ · ${votes(r.count)}`:'No votes yet';
function uploader(tag){return `<div class="up"><label class="btn">${cam.replace('<svg','<svg width="20" height="20"')} Add photos<input type="file" accept="image/jpeg,image/png,image/webp,image/gif" multiple data-upload="${tag}"></label><span class="muted small upmsg" aria-live="polite"></span></div>`}

async function load(){
  try{
    const [r,p,o]=await Promise.all([fetch('api/ratings?voter='+encodeURIComponent(VOTER)).then(x=>x.json()),fetch('api/photos').then(x=>x.json()),fetch('api/dish-photos').then(x=>x.json())]);
    S.official={};for(const [k,v] of Object.entries(o.photos||{}))if(byId[k])S.official[k]=String(v);
    S.ratings=r.ratings||{};S.mine=r.mine||{};
    S.photos=(p.photos||[]).filter(x=>x.dish==='general'||byId[x.dish]).map(x=>({id:String(x.id),dish:x.dish,url:String(x.url).replace(/^\/+/,''),thumb:String(x.thumb||x.url).replace(/^\/+/,'')}));
    S.loaded=true;
  }catch(e){}
  paint();
}

function ranked(){
  const rated=D.filter(d=>S.ratings[d.id]&&S.ratings[d.id].count).sort((a,b)=>S.ratings[b.id].avg-S.ratings[a.id].avg||S.ratings[b.id].count-S.ratings[a.id].count);
  return rated.concat(D.filter(d=>!rated.includes(d)));
}

function paint(){
  const tb=document.getElementById('standings');
  if(tb){tb.innerHTML=ranked().map((d,i)=>{const r=S.ratings[d.id];const has=r&&r.count;
    return `<tr class="${has&&i===0?'top1':''}"><td class="n">${has?i+1:'–'}</td><td><a href="#${d.id}">${esc(d.name)}</a>${has?`<span class="bar"><i style="width:${(r.avg/5*100).toFixed(1)}%"></i></span>`:''}</td><td class="r">${has?r.avg.toFixed(1)+' ★':'<span class="muted">–</span>'}</td><td class="r">${has?r.count:0}</td></tr>`}).join('')}
  document.querySelectorAll('[data-rate]').forEach(el=>{const r=S.ratings[el.dataset.rate];el.textContent=r&&r.count?summary(r):''});
  const d=byId[decodeURIComponent(location.hash.slice(1))];
  if(d){
    const s=summary(S.ratings[d.id]);
    const h=document.getElementById('hsum');if(h)h.textContent=s;
    const dr=document.getElementById('dish-rating');if(dr)dr.textContent=s;
    const mine=S.mine[d.id]||0;
    document.querySelectorAll('[data-star]').forEach(b=>{const on=+b.dataset.star<=mine;b.classList.toggle('on',on);b.setAttribute('aria-pressed',String(+b.dataset.star===mine))});
    const mm=document.getElementById('mine-msg');if(mm)mm.textContent=mine?`You gave it ${mine} star${mine>1?'s':''}. Tap again to change it, or tap the same star to take it back.`:'Tap a star. You can change your vote any time.';
  }
  const g=document.getElementById('gallery');
  if(g){const tag=g.dataset.tag;const list=tag==='all'?S.photos:S.photos.filter(p=>p.dish===tag);
    const key=list.map(p=>p.id).join(',');
    if(g.dataset.key!==key||!g.dataset.key&&!key){g.dataset.key=key;
      g.innerHTML=list.length?'<div class="gal">'+list.map(p=>`<button type="button" class="gi" data-photo="${esc(p.id)}" aria-label="Open photo"><img src="${esc(p.thumb)}" alt="" loading="lazy">${tag==='all'&&p.dish!=='general'?`<small>${esc(byId[p.dish].name)}</small>`:''}</button>`).join('')+'</div>':`<p class="muted">${S.loaded?'No photos yet. Be the first.':'Loading photos…'}</p>`}}
  fillSlots();
}

function fillSlots(){
  document.querySelectorAll('.ph[data-dish]').forEach(el=>{
    const id=el.dataset.dish;
    const g=S.photos.find(p=>p.dish===id);
    const url=S.official[id]||(g&&g.thumb);
    if(url&&el.dataset.src!==url){const im=new Image();im.alt=byId[id].name;im.src=url;el.dataset.src=url;put(el,im)}
  });
}
function put(el,im){const old=el.querySelector('img');if(old)old.remove();el.appendChild(im)}

async function rate(id,n){
  const prev=S.mine[id]||0;const val=n===prev?0:n;
  S.mine[id]=val;paint();
  try{const r=await fetch('api/rate',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({dish:id,voter:VOTER,stars:val})});if(!r.ok)throw 0}
  catch(e){S.mine[id]=prev;const mm=document.getElementById('mine-msg');paint();if(mm)mm.textContent='Couldn’t save that vote. Check your connection and try again.';return}
  load();
}

const MAX_MB=40;
const mb=n=>(n/1048576).toFixed(1)+' MB';
async function upload(input){
  const tag=input.dataset.upload;const msg=input.closest('.up').querySelector('.upmsg');
  const files=[...input.files];input.value='';if(!files.length)return;
  let ok=0,err='';
  for(let i=0;i<files.length;i++){
    const f=files[i];
    if(f.size>MAX_MB*1048576){err=`${f.name} is ${mb(f.size)}, over the ${MAX_MB} MB limit.`;continue}
    msg.textContent=`Uploading ${i+1} of ${files.length} (${mb(f.size)}), full quality…`;
    try{
      const r=await fetch('api/photos?dish='+encodeURIComponent(tag),{method:'POST',headers:{'Content-Type':f.type||'application/octet-stream'},body:f});
      if(r.ok)ok++;else{const j=await r.json().catch(()=>({}));err=j.error||'Upload failed.'}}
    catch(e){err='Upload failed. Check your connection.'}
  }
  msg.textContent=ok?`Added ${ok} photo${ok>1?'s':''}.`+(err?' '+err:''):err;
  load();
}

const ov=document.createElement('div');ov.className='ov';ov.hidden=true;document.body.appendChild(ov);
let lastFocus=null;
function openOv(html){lastFocus=document.activeElement;ov.innerHTML=html;ov.hidden=false;const f=ov.querySelector('button,input');if(f)f.focus()}
function closeOv(){ov.hidden=true;ov.innerHTML='';if(lastFocus&&lastFocus.focus)lastFocus.focus()}
function openPhoto(pid){
  const p=S.photos.find(x=>x.id===pid);if(!p)return;
  const d=byId[p.dish];
  openOv(`<div class="box"><img src="${esc(p.url)}" alt=""><div class="row"><a class="btn ghost" href="${esc(p.url)}" target="_blank" rel="noopener" style="color:#fff">Full size</a>${d?`<a class="btn ghost" href="#${d.id}" data-close style="color:#fff">${esc(d.name)}</a>`:''}${S.admin?`<button type="button" class="btn danger" data-del="${esc(p.id)}">Delete photo</button>`:''}<button type="button" class="btn" data-close>Close</button></div></div>`);
}
function openHost(){
  openOv(`<form class="form" id="hostform"><h2 style="font-size:30px;text-transform:uppercase">Host tools</h2>
  <p class="muted small" style="margin:0">${S.admin?'Host tools are on in this browser. Open any photo to delete it.':'Enter the admin phrase from your .env file to be able to delete guest photos.'}</p>
  ${S.admin?'':'<input type="password" id="tok" autocomplete="off" aria-label="Admin phrase" placeholder="Admin phrase">'}
  <p class="small" id="hostmsg" style="margin:0;color:var(--gold)" aria-live="polite"></p>
  <div class="row">${S.admin?'<button type="button" class="btn ghost" data-logout style="color:#fff">Turn off</button>':'<button class="btn">Turn on</button>'}<button type="button" class="btn ghost" data-close style="color:#fff">Close</button></div></form>`);
}
ov.addEventListener('click',async e=>{
  if(e.target===ov||e.target.closest('[data-close]')){closeOv();return}
  const del=e.target.closest('[data-del]');
  if(del){if(del.dataset.confirm!=='1'){del.dataset.confirm='1';del.textContent='Tap again to delete for good';return}
    const r=await fetch('api/photos/'+encodeURIComponent(del.dataset.del),{method:'DELETE',headers:{'X-Admin-Token':S.admin}});
    if(r.ok){closeOv();load()}else{del.textContent=r.status===403?'Admin phrase no longer valid':'Couldn’t delete'}return}
  if(e.target.closest('[data-logout]')){S.admin='';store.set('hg-admin','');closeOv()}
});
ov.addEventListener('submit',async e=>{
  e.preventDefault();const t=document.getElementById('tok').value.trim();const m=document.getElementById('hostmsg');
  try{const r=await fetch('api/admin/check',{headers:{'X-Admin-Token':t}}).then(x=>x.json());
    if(r.ok){S.admin=t;store.set('hg-admin',t);closeOv()}else m.textContent='That phrase didn’t match.'}catch(err){m.textContent='Couldn’t reach the server.'}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!ov.hidden)closeOv()});
document.addEventListener('change',e=>{const i=e.target.closest('[data-upload]');if(i)upload(i)});
document.addEventListener('click',e=>{
  const s=e.target.closest('[data-star]');if(s){const d=byId[decodeURIComponent(location.hash.slice(1))];if(d)rate(d.id,+s.dataset.star);return}
  const ph=e.target.closest('[data-photo]');if(ph){openPhoto(ph.dataset.photo);return}
  const go=e.target.closest('[data-goto]');if(go){document.getElementById(go.dataset.goto).scrollIntoView({behavior:'smooth'});return}
  if(e.target.closest('[data-host]'))openHost();
});
setInterval(()=>{if(!document.hidden)load()},15000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)load()});

function route(){
  const h=decodeURIComponent(location.hash.slice(1));
  const d=D.find(x=>x.id===h);
  d?dish(d):home();
  paint();
}
app.addEventListener('click',e=>{
  const j=e.target.closest('[data-jump]');
  if(j){e.preventDefault();document.getElementById('recipe-card').scrollIntoView({behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth'});return}
  const b=e.target.closest('.ing button');
  if(b){b.classList.toggle('done');b.setAttribute('aria-pressed',b.classList.contains('done'))}
});
addEventListener('hashchange',route);
route();
load();
}
</script>
</body>
</html>
